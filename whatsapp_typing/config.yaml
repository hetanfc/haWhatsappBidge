---
name: WhatsApp Typing Sensor
version: "1.4.0"
slug: whatsapp_typing
description: Attività WhatsApp di un contatto: typing, presenza, reazioni, modifiche, eliminazioni e spunte
url: https://github.com/hetanfc/haWhatsappBidge
arch:
  - aarch64
  - amd64
  - armv7
init: false
boot: auto
startup: application
homeassistant_api: true
services:
  - mqtt:want
options:
  phone_number: ""
  pair_phone: ""
  contact_name: "Contatto"
  composing_timeout: 20
  off_delay: 3
  activity_sticky: 30
  mark_online: true
  store_message_content: true
  message_retention_days: 60
  publisher: mqtt
  log_level: info
schema:
  phone_number: str
  pair_phone: str?
  contact_name: str
  composing_timeout: int(5,300)
  off_delay: int(0,120)
  activity_sticky: int(1,600)
  mark_online: bool
  store_message_content: bool
  message_retention_days: int(1,3650)
  publisher: list(mqtt|ha)
  log_level: list(debug|info|warn|error)
  jid_override: str?
  push_name: str?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
  mqtt_tls: bool?

<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Archivio WhatsApp</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--text:#202124;--muted:#687078;--line:#dfe3e7;--accent:#008069;--mine:#d9fdd3;--deleted:#fff0f0;--edited:#fff8df;--danger:#c62828}
    @media(prefers-color-scheme:dark){:root{--bg:#111b21;--card:#202c33;--text:#e9edef;--muted:#aebac1;--line:#374248;--accent:#00a884;--mine:#005c4b;--deleted:#49272b;--edited:#453d20;--danger:#ff7b86}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}header{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:16px}.top,main{max-width:1050px;margin:auto}.heading{display:flex;align-items:center;gap:10px;margin-bottom:12px}h1{font-size:21px;margin:0}h2{font-size:18px;margin:0 0 12px}.back{padding:8px 11px;background:transparent;color:var(--accent);border:1px solid var(--accent)}.controls{display:grid;grid-template-columns:1fr auto;gap:10px}input,select,textarea,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--text)}button{background:var(--accent);color:#fff;border:0;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:8px;color:var(--muted);font-size:13px}main{padding:18px 12px}.composer{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:20px}.composer-grid{display:grid;grid-template-columns:260px 1fr auto;gap:10px;align-items:start}.composer textarea{min-height:78px;resize:vertical}.send-status.error{color:var(--danger)}.send-status.ok{color:var(--accent)}.archive-title{margin:4px 0 10px}.message{background:var(--card);border:1px solid var(--line);border-radius:13px;margin:10px 0;padding:13px 15px;box-shadow:0 1px 2px #0001}.message.mine{margin-left:7%;background:var(--mine)}.message.deleted{border-left:5px solid #e35d6a;background:var(--deleted)}.message.edited:not(.deleted){border-left:5px solid #d4a72c;background:var(--edited)}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:7px}.badge{border:1px solid currentColor;border-radius:999px;padding:2px 7px}.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.empty{color:var(--muted);text-align:center;padding:40px}.revisions{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.revisions summary{cursor:pointer;color:var(--muted)}.revision{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px;padding-left:10px;border-left:2px solid var(--line)}
    @media(max-width:720px){.controls,.composer-grid{grid-template-columns:1fr}.message.mine{margin-left:3%}.composer button{width:100%}}
  </style>
</head>
<body>
<header><div class="top"><div class="heading"><button class="back" id="back" type="button" aria-label="Torna indietro">← Indietro</button><h1 id="title">WhatsApp</h1></div><div class="controls"><input id="search" type="search" placeholder="Cerca nel testo completo…"><select id="filter"><option value="all">Tutti</option><option value="received">Ricevuti</option><option value="sent">Inviati</option><option value="deleted">Cancellati</option><option value="edited">Modificati</option></select></div><div class="status" id="status">Caricamento…</div></div></header>
<main>
  <section class="composer" aria-labelledby="send-title">
    <h2 id="send-title">Invia un messaggio al gruppo</h2>
    <div class="composer-grid">
      <select id="recipient" aria-label="Gruppo"><option value="">Caricamento gruppi…</option></select>
      <textarea id="outgoing" maxlength="4096" placeholder="Scrivi un solo messaggio…" aria-label="Messaggio"></textarea>
      <button id="send" type="button" disabled>Controlla e invia</button>
    </div>
    <div class="status send-status" id="send-status">Il messaggio verrà inviato soltanto dopo la conferma.</div>
  </section>
  <h2 class="archive-title">Archivio</h2>
  <section id="messages"></section>
</main>
<script>
const list=document.querySelector('#messages'),statusEl=document.querySelector('#status'),search=document.querySelector('#search'),filter=document.querySelector('#filter'),recipient=document.querySelector('#recipient'),outgoing=document.querySelector('#outgoing'),sendButton=document.querySelector('#send'),sendStatus=document.querySelector('#send-status');let timer;
document.querySelector('#back').addEventListener('click',()=>{try{if(window.top.history.length>1){window.top.history.back()}else{window.top.location.href='/'}}catch{window.location.href='/'}});
const fmt=v=>new Intl.DateTimeFormat('it-IT',{dateStyle:'short',timeStyle:'medium'}).format(new Date(v));
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function render(data){document.querySelector('#title').textContent='WhatsApp · '+data.contact;list.replaceChildren();statusEl.textContent=data.messages.length+' messaggi visualizzati';if(!data.messages.length){list.append(el('div','empty','Nessun messaggio trovato'));return}for(const m of data.messages){const card=el('article','message'+(m.from_me?' mine':'')+(m.deleted_at?' deleted':'')+(m.edited_at?' edited':''));const meta=el('div','meta');meta.append(el('span','',fmt(m.at)),el('span','badge',m.from_me?'inviato':'ricevuto'),el('span','badge',m.kind));if(m.deleted_at)meta.append(el('span','badge','cancellato '+fmt(m.deleted_at)));if(m.edited_at)meta.append(el('span','badge','modificato '+fmt(m.edited_at)));card.append(meta,el('div','text',m.text||'['+m.kind+']'));if(m.revisions?.length){const details=el('details','revisions'),summary=el('summary','',m.revisions.length+' versioni precedenti');details.append(summary);for(const r of m.revisions){const rev=el('div','revision');rev.append(el('div','meta',fmt(r.at)+' · '+r.kind),el('div','text',r.text));details.append(rev)}card.append(details)}list.append(card)}}
async function load(){statusEl.textContent='Caricamento…';const p=new URLSearchParams({filter:filter.value,q:search.value,limit:'1000'});try{const response=await fetch('api/messages?'+p);if(!response.ok)throw new Error(response.status);render(await response.json())}catch(e){statusEl.textContent='Errore nel caricamento';list.replaceChildren(el('div','empty','Impossibile leggere l’archivio'))}}
async function loadRecipients(){try{const response=await fetch('api/recipients');const data=await response.json();if(!response.ok)throw new Error(data.error||'Errore');recipient.replaceChildren(new Option('Scegli un gruppo…',''));for(const item of data.recipients)recipient.add(new Option(item.name,item.id));sendStatus.textContent=data.recipients.length+' gruppi disponibili';updateSendButton()}catch(e){recipient.replaceChildren(new Option('Gruppi non disponibili',''));sendStatus.textContent=e.message;sendStatus.className='status send-status error'}}
function updateSendButton(){sendButton.disabled=!recipient.value||!outgoing.value.trim()}
sendButton.addEventListener('click',async()=>{const name=recipient.options[recipient.selectedIndex]?.textContent||'gruppo',text=outgoing.value.trim();if(!text||!recipient.value)return;if(!confirm('Inviare a “'+name+'” questo unico messaggio?\n\n'+text))return;sendButton.disabled=true;sendStatus.className='status send-status';sendStatus.textContent='Invio in corso…';try{const response=await fetch('api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:crypto.randomUUID(),target:recipient.value,text})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Invio fallito');outgoing.value='';sendStatus.className='status send-status ok';sendStatus.textContent='Messaggio inviato una volta a '+data.recipient;setTimeout(load,1200)}catch(e){sendStatus.className='status send-status error';sendStatus.textContent=e.message}finally{updateSendButton()}});
recipient.addEventListener('change',updateSendButton);outgoing.addEventListener('input',updateSendButton);search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,250)});filter.addEventListener('change',load);loadRecipients();load();
</script>
</body>
</html>
